name: Linux News Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# يمنع تداخل تشغيلين في نفس الوقت (سبب المشكلة!)
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install feedparser requests

      - name: تشغيل البوت
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python news_bot_actions.py

      - name: حفظ سجل الأخبار
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted_news.json
          if git diff --cached --quiet; then
            echo "لا تغييرات — لا حاجة للحفظ"
          else
            git commit -m "تحديث سجل الأخبار [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
